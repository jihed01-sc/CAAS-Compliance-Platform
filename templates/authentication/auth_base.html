{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CAAS - Compliance as a Service{% endblock %}</title>

    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #0a0a0b;
            --secondary-bg: #1a1a1d;
            --card-bg: #16161a;
            --neon-blue: #800727;
            --neon-purple: #0ea81b;
            --neon-green: #0ea81b;
            --neon-pink: #ff006e;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #666666;
            --border-color: #333;
            --success: #12a61e;
            --warning: #91773d;
            --danger: #700a0d;
            --input-bg: #2a2a2d;
            --input-border: #404044;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
        }

        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--neon-blue);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Form Container */
        .form_container {
            width: 100%;
            max-width: 420px;
            height: fit-content;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 40px 30px 40px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow:
                0px 20px 80px rgba(0, 0, 0, 0.3),
                0px 10px 40px rgba(0, 212, 255, 0.1),
                inset 0px 1px 0px rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-family: "Inter", sans-serif;
            position: relative;
        }

        .form_container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-green));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: exclude;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0.3;
        }

        /* Logo */
        .logo_container {
            box-sizing: border-box;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .logo_container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Title Section */
        .title_container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        .title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.875rem;
            max-width: 90%;
            text-align: center;
            line-height: 1.4;
            color: var(--text-secondary);
        }

        /* Input Styles */
        .input_container {
            width: 100%;
            height: fit-content;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .icon {
            width: 20px;
            height: 20px;
            position: absolute;
            z-index: 99;
            left: 15px;
            bottom: 12px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        .icon svg path {
            stroke: var(--text-muted);
            transition: all 0.3s ease;
        }

        .input_label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-left: 4px;
        }

        .input_field {
            width: 100%;
            height: 48px;
            padding: 0 15px 0 50px;
            border-radius: 12px;
            outline: none;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.15, 0.83, 0.66, 1);
        }

        .input_field::placeholder {
            color: var(--text-muted);
        }

        .input_field:focus {
            border: 1px solid var(--neon-blue);
            box-shadow: 0px 0px 0px 3px rgba(0, 212, 255, 0.1);
            background: var(--card-bg);
        }

        .input_field:focus + .icon svg path,
        .input_field:focus ~ .icon svg path {
            stroke: var(--neon-blue);
        }

        /* Buttons */
        .sign-in_btn {
            width: 100%;
            height: 48px;
            border: 0;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border-radius: 12px;
            outline: none;
            color: #ffffff;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sign-in_btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .sign-in_btn:active {
            transform: translateY(0);
        }

        .sign-in_ggl, .sign-in_apl {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--input-bg);
            border-radius: 12px;
            outline: none;
            color: var(--text-primary);
            border: 1px solid var(--input-border);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .sign-in_ggl:hover, .sign-in_apl:hover {
            border-color: var(--neon-blue);
            background: var(--card-bg);
            transform: translateY(-1px);
        }

        .sign-in_apl {
            background: #1a1a1a;
            border-color: #333;
        }

        /* Separator */
        .separator {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: var(--text-muted);
            margin: 10px 0;
        }

        .separator .line {
            display: block;
            width: 100%;
            height: 1px;
            border: 0;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
        }

        .separator span {
            font-size: 0.875rem;
            white-space: nowrap;
            padding: 0 10px;
        }

        /* Note */
        .note {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .note:hover {
            color: var(--neon-blue);
        }

        /* Switch Form Link */
        .switch-form {
            margin-top: 15px;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .switch-form a {
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .switch-form a:hover {
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        /* Error Messages */
        .error-message {
            background: rgba(255, 0, 110, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 15px;
            width: 100%;
        }

        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 15px;
            width: 100%;
        }

        /* Loading State */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading .sign-in_btn {
            background: var(--text-muted);
        }

        /* ===== CUSTOM CHECKBOX STYLING ===== */
        /* Hide default checkbox */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            margin: 0;
            flex-shrink: 0;
        }

        /* Checkbox hover state */
        input[type="checkbox"]:hover {
            border-color: var(--neon-blue);
            background: var(--card-bg);
        }

        /* Checkbox checked state */
        input[type="checkbox"]:checked {
            background: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        /* Checkbox checkmark */
        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 5px;
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Checkbox focus state */
        input[type="checkbox"]:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        /* Checkbox label styling */
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.4;
            cursor: pointer;
            margin: 15px 0;
            user-select: none;
        }

        .checkbox-label:hover {
            color: var(--text-primary);
        }

        .checkbox-label a {
            color: var(--neon-blue);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .checkbox-label a:hover {
            color: var(--neon-green);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form_container {
                margin: 20px;
                padding: 30px 25px;
                max-width: none;
            }

            .title {
                font-size: 1.25rem;
            }

            .subtitle {
                font-size: 0.8rem;
            }
        }

        /* Additional animations */
        .form_container {
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation"></div>
    <div class="particle-container" id="particles"></div>

    <div class="form_container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 25;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                container.appendChild(particle);
            }
        }

        createParticles();

        // Form validation and enhancement
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('.input_field');

            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentNode.classList.add('focused');
                });

                input.addEventListener('blur', function() {
                    if (!this.value) {
                        this.parentNode.classList.remove('focused');
                    }
                });
            });

            // Add loading state to form submission
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function() {
                    this.classList.add('loading');
                });
            }
        });
    </script>
</body>
</html>
